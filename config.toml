# 근태 모니터링 데모 설정
# 이 파일만 고치면 기간, 팀, 출근 기준 시각, 탐지 기준이 모두 바뀝니다.

[period]
start_monday = 2026-09-21   # 첫 주 월요일
weeks = 8
# 평일 공휴일 (데모용 2026년 달력: 추석 연휴, 개천절 대체공휴일, 한글날)
# 실제 운영 시에는 회사 휴무일 달력으로 바꿉니다.
holidays = [2026-09-24, 2026-09-25, 2026-10-05, 2026-10-09]

[work]
default_start = "09:00"   # 팀·개인 설정이 없을 때 쓰는 출근 기준 시각
late_grace_min = 0        # 지각 유예(분). 5로 두면 기준 시각 +5분까지는 지각이 아님

# ── 팀 목록 ─────────────────────────────────────────────
# 팀에 start 를 적으면 그 팀 전체의 출근 기준이 바뀝니다. (예: start = "10:00")
# 우선순위: 개인 설정 > 팀 설정 > default_start

[[teams]]
name = "게임QA"
size = 10

[[teams]]
name = "모바일QA"
size = 10

[[teams]]
name = "고객상담"
size = 10
start = "09:00"           # 고객상담팀 일반조 기준. 시차 출근자는 아래 employee_start 참고

[[teams]]
name = "게임운영"
size = 10

[[teams]]
name = "경영지원"
size = 10

# ── 개인별 출근 기준 (팀 설정보다 우선) ─────────────────
# 고객상담팀 시차 출근 예시: 조기조 07:00, 늦은조 11:00
[employee_start]
E022 = "07:00"
E023 = "07:00"
E024 = "07:00"
E028 = "11:00"
E029 = "11:00"
E030 = "11:00"

# ── 탐지 기준 ───────────────────────────────────────────
[thresholds]
weekly_limit = 52          # 초과: 주 실근로가 이 값을 넘음 (법정 40 + 연장 12)
weekly_danger = 48         # 위험: 이 값 초과 ~ limit 이하
weekly_caution = 44        # 주의: 이 값 초과 ~ danger 이하
chronic_weeks = 3          # '위험' 이상인 주가 이 횟수 이상이면 "장시간 근로 반복"
late_window_weeks = 4      # 반복 지각을 세는 기간(주)
late_repeat_count = 3      # 위 기간에 지각이 이 횟수 이상이면 "반복 지각"
bias_min_events = 5        # 요일 편중을 판단하는 최소 지각·결근 건수
bias_share = 0.6           # 한 요일 비중이 이 값 이상이면 "특정 요일 편중"
worsening_ratio = 2.0      # 최근 기간 지각이 직전 기간의 이 배수 이상이면 "지각 증가 추세"
absence_repeat_count = 2   # 무단결근이 이 횟수 이상이면 "무단결근 반복"
holiday_adjacent_count = 2 # 휴일 전후 근무일 결근이 이 횟수 이상이면 "휴일 전후 결근"

[generate]
seed = 42                  # 같은 시드면 항상 같은 가상 데이터가 만들어집니다
